name: Scheduled Ocean Data Pipeline

on:
  schedule:
    # 每天 UTC 00:00 與 12:00 自動執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動一鍵觸發

jobs:
  fetch-compute-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scientific Dependencies
        run: |
          pip install numpy scipy requests

      - name: Run Ocean Data Pipeline
        run: |
          python pipeline/update_ocean_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-update ocean data and metrics [skip ci]" || exit 0
          git push
